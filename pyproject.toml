[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-agent"
version = "0.1.0"
description = "Event-driven terminal harness for tool-using language model agents"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.40,<2",
  "python-dotenv>=1.0,<2",
  "rich>=13.7,<15",
  "textual>=0.50,<1",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0,<2"]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1"]

[tool.pytest.ini_options]
testpaths = ["test_*.py"]
addopts = "-ra"
