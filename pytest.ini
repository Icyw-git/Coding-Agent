[pytest]
addopts = -ra
norecursedirs = .git .cache .worktrees visualizer/node_modules
pythonpath = . src tests
testpaths = tests
# Keep tmp dirs of FAILED tests on disk; passing tests are still cleaned up
# immediately.
#
# Do NOT use "none" here: that policy sets keep=0 (_pytest/tmpdir.py:211),
# which in turn
#   1) skips creating the .lock file (see _pytest/pathlib.py:403, only created
#      when keep != 0),
#   2) makes max_delete = max_existing - 0, i.e. every numbered dir under the
#      shared root becomes a cleanup candidate, and
#   3) makes ensure_deletable() return True for every lock-less dir
#      (pathlib.py:313).
# As a result any exiting pytest process deletes the basetemp dirs that OTHER
# concurrently running pytest processes still use (%TEMP%/pytest-of-<user> is
# shared by all processes), taking their session event files with it.
# Observed in practice: the dir got wiped mid-run and
# test_snip_hysteresis_between_fires failed on a history_snipped event count.
# "failed" restores the default keep=3 and the lock file.
#
# NOTE: keep this file ASCII-only. iniconfig decodes it with the system locale
# (GBK on this machine), so non-ASCII comments make pytest fail at startup.
tmp_path_retention_policy = failed
